services:
  postgres:
    image: postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: reviver
      POSTGRES_DB: reviver
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./pg_data:/var/lib/postgresql/data
  reviver:
    build: .
    env_file: 
    - .env
    environment:
      DB_DSN: postgresql://reviver:${POSTGRES_PASSWORD}@postgres:5432/reviver
    restart: always
    links:
      - postgres
    depends_on:
      - postgres
